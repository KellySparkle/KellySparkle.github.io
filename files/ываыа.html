<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переворачивающийся блок</title>
    <style>
    </style>
</head>
<body>
    <a href="mailto:ваш_email@example.com?subject=Тема&body=Привет!">
        <button>Написать мне</button>
    </a>    
    <form action="sendmail.php" method="post">
        <label>Ваше имя:</label>
        <input type="text" name="username" required><br><br>
        <label>Ваш email:</label>
        <input type="email" name="useremail" required><br><br>
        <label>Сообщение:</label>
        <textarea name="message" required></textarea><br><br>
        <input type="submit" value="Отправить">
    </form>
    <button id="openForm">Написать мне</button>
    <div id="popup" style="display:none;">
        <form id="mailForm">
            <label>Ваше имя:</label>
            <input type="text" name="username" required><br><br>
            <label>Ваш email:</label>
            <input type="email" name="useremail" required><br><br>
            <label>Сообщение:</label>
            <textarea name="message" required></textarea><br><br>
            <input type="submit" value="Отправить">
        </form>
    </div>
    <script>
        document.getElementById('openForm').addEventListener('click', function() {
            document.getElementById('popup').style.display = 'block';
        });
        
        document.getElementById('mailForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Для отправки через PHP, вам нужно отправить запрос на сервер
            // Для mailto:
            var mailtoLink = "kellisparkl@yandex.ru?subject=Сообщение&body=" + encodeURIComponent("Имя: " + document.getElementsByName('username')[0].value + "\nEmail: " + document.getElementsByName('useremail')[0].value + "\nСообщение: " + document.getElementsByName('message')[0].value);
            window.location.href = mailtoLink;
        });    
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переворачивающийся блок</title>
    <style>
        .container {
            width: 200px;
            height: 40px;
            perspective: 1000px;
        }
        .flip-box {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
        }
        .flipped {
            transform: rotateY(180deg);
        }
        .flip-box .side {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
        }
        .flip-box .back {
            transform: rotateY(180deg);
            background-color: #d0d0d0;
        }
    </style>
</head>
<body>
    <div class="container" id="flipBlock">
        <div class="flip-box" id="flipBox">
            <div class="side front"></div>
            <div class="side back">Текст на обратной стороне</div>
        </div>
    </div>

    <script>
        const flipBox = document.getElementById('flipBox');
        
        flipBox.addEventListener('mouseenter', () => {
            flipBox.classList.add('flipped');
        });
        
        flipBox.addEventListener('mouseleave', () => {
            flipBox.classList.remove('flipped');
        });
    </script>
</body>
</html>
